<!DOCTYPE html>
<html>
<head>
  <title>Gadget Hush Store</title>

  <style>
    body{
      background:black;
      color:white;
      font-family:Arial;
      text-align:center;
    }

    h1{
      color:cyan;
      margin-top:50px;
    }

    .box{
      background:#222;
      padding:20px;
      margin:20px auto;
      width:300px;
      border-radius:10px;
    }

    button{
      background:cyan;
      border:none;
      padding:10px 20px;
      border-radius:5px;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <h1>My Gadget Store</h1>

  <div class="box">
    <h2>iPhone 15 Pro</h2>
    <p>$999</p>
    <button>Buy Now</button>
  </div>

  <div class="box">
    <h2>PlayStation 5</h2>
    <p>$650</p>
    <button>Buy Now</button>
  </div>

</body>
</html>
